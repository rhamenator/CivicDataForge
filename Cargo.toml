[package]
name = "civic-data-forge"
version = "0.1.0"
edition = "2024"
authors = ["Richard M. Hamilton"]
description = "Validated field-observation ingestion and regional profiling"
repository = "https://github.com/rhamenator/CivicDataForge"

[package.metadata.wix]
upgrade-guid = "4E294C79-2A3C-4428-9D04-B082E880A200"
path-guid = "84F2E657-38FC-4EEE-A119-E7F1B0D12671"
license = false
eula = false

[dependencies]
csv = "1.4"
serde = { version = "1", features = ["derive"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
